name: Benchmark

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    uses: floor/vlist.io/.github/workflows/perf.yml@main
    with:
      vlist_repository: ${{ github.repository }}
      vlist_ref: ${{ github.head_ref }}
      source_repository: ${{ github.repository }}
      source_pr_number: "${{ github.event.pull_request.number }}"
