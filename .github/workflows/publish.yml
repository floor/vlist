name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build --types

      # Trusted publishing needs npm 11.5.1 or later; moving `next` with the
      # workflow's OIDC identity needs 11.21.0 (npm's trusted-publishing docs,
      # "Managing dist-tags with trusted publishing"). Pinned, bump on purpose.
      - name: Newer npm
        run: npm install -g npm@11.21.0

      # No NODE_AUTH_TOKEN: the workflow's own OIDC identity is what npm
      # trusts (the package's trusted publisher is floor/vlist publish.yml).
      # With a token set, npm authenticates as that token instead and a token
      # without publish rights on this package answers 404 on the PUT, which
      # is what v2.6.2 hit.
      # The tag must name the version in package.json, or nothing is published.
      - name: Check tag matches version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Prereleases (a version with a hyphen, e.g. 3.0.0-next.1) go to the npm
      # `next` dist-tag so `latest` is never moved by a prerelease.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      # npm 11.21.0 can move `next` with this workflow's OIDC identity once the
      # package's trusted publisher allows it: "Allow npm dist-tag" in the
      # Trusted Publisher settings on npmjs.com (disabled by default). Stable
      # only: a prerelease already published under `next`. The step is allowed
      # to fail — with the setting off it does — and check-dist-tags.ts below is
      # the fallback that still names the command a maintainer runs (#334).
      - name: Move next to this release
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        run: npm dist-tag add "vlist@${GITHUB_REF_NAME#v}" next

      # The notes are the tag's CHANGELOG.md section and its compare link
      # (scripts/release-notes.ts), not GitHub's generated notes. A re-run on
      # the same tag edits the existing release's notes instead of failing.
      - name: Create GitHub Release
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          bun scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          if [[ "$version" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # vlist.io production installs vlist from npm, but nothing redeployed it
      # on a release, so it fell behind by four (3.1.6 against 3.3.0). Stable
      # only, and only once the package and the release are out; vlist.io's
      # deploy installs this exact version and waits for the registry to serve
      # it. A refused dispatch must not turn a release that is already out red.
      - name: Redeploy vlist.io
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: floor/vlist.io
          event-type: vlist-released
          client-payload: '{"version": "${{ github.ref_name }}"}'

      # The fallback for the move above (#334): a stable publish moves `latest`
      # only, and the OIDC `next` move fails while "Allow npm dist-tag" is off,
      # so `next` can still fall below `latest`. Last, so the package and the
      # release are already out: it reads the public dist-tags and warns with
      # the command a maintainer runs.
      - name: Check next dist-tag is not below latest
        if: ${{ !contains(github.ref_name, '-') }}
        run: bun scripts/check-dist-tags.ts "${GITHUB_REF_NAME#v}"
