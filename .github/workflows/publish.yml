name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build --types

      # Trusted publishing needs npm 11.5.1 or later; setup-node ships 10.x
      - name: Newer npm
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: the workflow's own OIDC identity is what npm
      # trusts (the package's trusted publisher is floor/vlist publish.yml).
      # With a token set, npm authenticates as that token instead and a token
      # without publish rights on this package answers 404 on the PUT, which
      # is what v2.6.2 hit.
      # The tag must name the version in package.json, or nothing is published.
      - name: Check tag matches version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Prereleases (a version with a hyphen, e.g. 3.0.0-next.1) go to the npm
      # `next` dist-tag so `latest` is never moved by a prerelease.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
