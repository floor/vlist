name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build --types

      # Trusted publishing needs npm 11.5.1 or later; setup-node ships 10.x
      - name: Newer npm
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: the workflow's own OIDC identity is what npm
      # trusts (the package's trusted publisher is floor/vlist publish.yml).
      # With a token set, npm authenticates as that token instead and a token
      # without publish rights on this package answers 404 on the PUT, which
      # is what v2.6.2 hit.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
