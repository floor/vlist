name: CI

on:
  push:
    branches: [next, staging, main]
  pull_request:
    branches: [next, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Coverage threshold
        run: bun run scripts/coverage.ts --threshold 85

      - name: Build
        run: bun run build

      - name: Bundle size + tree-shaking
        run: bun run size

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suites load the built bundles from dist/ over a local server.
      - name: Build
        run: bun run build

      # scripts/browser-driver.mjs finds the runner's Chrome; puppeteer-core
      # ships no browser of its own.
      - name: Browser suites
        run: bun run test:browser
