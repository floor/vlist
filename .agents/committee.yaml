name: "vlist v2 Technical Committee"

project:
  name: "vlist"
  repo: "vlist"
  language: "typescript"
  runtime: "bun"
  conventions:
    semicolons: false
    quotes: "single"
    indent: 2
    modules: "esm"
  structure:
    backend: "src/"
    tests: "test/"
  packages: []
  customInstructions: |
    vlist is a high-performance virtual scrolling library. Zero dependencies,
    plugin architecture, TypeScript strict mode.

    v1 (current) is the absolute source of truth for behavior, math, and test
    assertions. v2 is strictly an architectural rewrite — no behavioral changes.

    ## Non-Negotiable Constraints

    - Zero allocations on the hot path (scroll handler runs every frame)
    - Zero runtime dependencies
    - No .map(), .filter(), spread (...), or object creation per frame
    - Direct property access over getters in hot paths
    - Element pooling — recycle DOM elements, never create/destroy per frame
    - Prefix sums for O(1) offset lookups in size cache

    ## Key v1 Source References

    These files contain the behavioral contracts v2 must preserve:

    - src/builder/core.ts — hot path (coreRenderIfNeeded L731-943), scroll handling (L960-1085), element pooling
    - src/builder/range.ts — range calculations, overscan, empty sentinel (start: 0, end: -1)
    - src/builder/types.ts — BuilderConfig, BuilderContext, VListFeature, VList interfaces
    - src/builder/materialize.ts — MRefs bag (short keys for minification), feature composition
    - src/rendering/measured.ts — auto-measurement, ResizeObserver feedback loop
    - src/rendering/viewport.ts — compressed mode, virtual offset mapping
    - src/rendering/sizes.ts — prefix-sum size cache
    - src/builder/api.ts — methods.get() pattern for feature overrides

    ## Critical v1 Behaviors to Preserve

    1. Render count safety cap (core.ts:765-778) — derived from screen size and item dimensions
    2. Zero container size early exit (core.ts:745-751)
    3. Empty range sentinel (range.ts:14-17) — start: 0, end: -1
    4. Overscan application (range.ts:44-50)
    5. Compressed mode positioning (core.ts:784-790)
    6. Synchronous wheel rendering (core.ts:1030-1085) — no rAF latency on wheel events
    7. Measurement feedback loop — ResizeObserver → size cache → re-render without layout thrash

agents:
  - id: claude
    name: "Claude (Opus 4.6)"
    promptTemplate: "agents/committee.md"
    llm:
      provider: anthropic
      model: claude-opus-4-20250514
      temperature: 0.3
      maxTokens: 4096
    capabilities: [read_code, review_rfc, vote]
    autonomy: T1
    customInstructions: ""

  - id: gemini
    name: "Gemini (3.1 Pro)"
    promptTemplate: "agents/committee.md"
    llm:
      provider: gemini
      model: gemini-2.5-pro
      temperature: 0.3
      maxTokens: 4096
    capabilities: [read_code, review_rfc, vote]
    autonomy: T1
    customInstructions: ""

  - id: gpt
    name: "GPT (Codex)"
    promptTemplate: "agents/committee.md"
    llm:
      provider: openai
      model: gpt-4.1
      temperature: 0.3
      maxTokens: 4096
    capabilities: [read_code, review_rfc, vote]
    autonomy: T1
    customInstructions: ""

workflow:
  states:
    - { id: draft,    label: "Draft",    taskManagerStatus: "Backlog",     terminal: false }
    - { id: review,   label: "Review",   taskManagerStatus: "In Progress", terminal: false }
    - { id: voting,   label: "Voting",   taskManagerStatus: "In Review",   terminal: false }
    - { id: approved, label: "Approved", taskManagerStatus: "Done",        terminal: true  }
    - { id: rejected, label: "Rejected", taskManagerStatus: "Canceled",    terminal: true  }

  transitions:
    - { from: draft,    to: review,   trigger: { type: label_added, label: "committee" }, agentId: null }
    - { from: review,   to: voting,   trigger: { type: label_added, label: "vote" },      agentId: null }
    - { from: voting,   to: approved, trigger: { type: vote_passed },                      agentId: null }
    - { from: voting,   to: rejected, trigger: { type: vote_failed },                      agentId: null }

chain:
  nodes:
    - agentId: claude
      receivesFrom: [{ type: trigger }]
      dispatchesTo: []
      reportsTo: null
      canApprove: true
      canReject: true

    - agentId: gemini
      receivesFrom: [{ type: trigger }]
      dispatchesTo: []
      reportsTo: null
      canApprove: true
      canReject: true

    - agentId: gpt
      receivesFrom: [{ type: trigger }]
      dispatchesTo: []
      reportsTo: null
      canApprove: true
      canReject: true

autonomy:
  default: T1
  overrides: []

guardrails:
  maxFilesPerTask: 0
  maxFileSizeBytes: 0
  maxTotalOutputBytes: 0
  blockedPaths: ["*"]
  allowedPaths: []
  blockedExtensions: ["*"]

costs:
  maxCostPerTask: 2.00
  maxCostPerDay: 20.00
  warnCostThreshold: 1.00

statusMapping:
  draft: "Backlog"
  review: "In Progress"
  voting: "In Review"
  approved: "Done"
  rejected: "Canceled"

sync:
  github:
    enabled: true
    owner: "floor"
    repo: "vlist"
    target: "discussions"
    syncOn: ["approved", "rejected"]
