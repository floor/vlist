# vlist — review committee
#
# The agents that deliberate and vote on proposals. They live apart from
# agents.yaml because `floor-agents run` implements an issue and refuses any
# manifest holding a `vote` agent: one file for the agents that write code, one
# for the agents that judge it.
#
# Members are the ones the committee scripts in floor/agents can actually run:
# Claude in-process, the others through a bridge on the gateway. That is how the
# three model families are seated — GPT through the Codex CLI, Grok through its
# own bridge, Gemini through Antigravity. For external members the bridge picks
# the model, so `provider` and `model` below are documentation, not dispatch.
#
# Project, sources and promotion are declared once, in agents.yaml.

name: "vlist 3.0 committee"

project:
  name: "vlist"
  root: ".."                  # relative to this file, so the repository root
  repo: "vlist"
  baseBranch: "next"
  language: "typescript"
  runtime: "bun"

agents:
  - id: claude
    name: "Claude"
    promptTemplate: "../../agents/agents/claude-reviewer.md"
    llm:
      provider: claude-code
      model: opus
      temperature: 0.3
      maxTokens: 32000
    capabilities: [read_code, review_rfc, vote]
    autonomy: T1

  - id: codex                 # GPT, through the Codex CLI
    name: "Codex"
    external: true
    promptTemplate: "../../agents/agents/codex-reviewer.md"
    llm:
      provider: openai
      model: local
    capabilities: [review_rfc, vote]
    autonomy: T1

  - id: grok
    name: "Grok"
    external: true
    promptTemplate: "../../agents/agents/grok-reviewer.md"
    llm:
      provider: cursor
      model: cursor-grok-4.6-high
    capabilities: [review_rfc, vote]
    autonomy: T1

  - id: antigravity           # Gemini. Parked: the GUI has no unattended wake,
    name: "Antigravity"       # so it is left out of the scripts' default AGENTS.
    external: true
    promptTemplate: "../../agents/agents/antigravity-reviewer.md"
    llm:
      provider: gemini
      model: local
    capabilities: [review_rfc, vote]
    autonomy: T1

# Claude is the only member that reads the repository locally; every external
# member is hosted, so none may read the private findings source.
guardrails:
  maxFilesPerTask: 20
  maxFileSizeBytes: 102400
  blockedPaths:
    - ".env*"
    - "*.pem"
    - "*.key"
    - ".github/workflows/*"
    - "package.json"
    - "bun.lock"
    - ".gitignore"
  privateSourceProviders: [claude-code, lmstudio]
